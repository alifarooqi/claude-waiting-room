name: integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tmux:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install tmux
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            brew install tmux
          else
            sudo apt-get update && sudo apt-get install -y tmux
          fi
      - name: Go integration tests (build tag: integration)
        run: cd daemon && go test -tags=integration ./...
