name: release-npm

# Publishes the @waiting-room/* packages to npm when a Changesets markdown
# file (.changeset/*.md) is consumed. Peer to release.yml, which keeps
# handling the goreleaser binary tarball + GitHub Release; this workflow
# handles the npm side. The two never conflict because their triggers
# differ (branches: [main] vs. tags: ['v*']).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write            # push the version-bump commit
  pull-requests: write       # reserved for a future marketplace bump step
  id-token: write            # npm provenance / OIDC-style automation

# Two pushes to main within a short window: serialize, don't cancel.
# The action is idempotent — a no-op (no changesets) just exits cleanly.
concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history for the version-bump commit

      - uses: pnpm/action-setup@v4   # picks up packageManager field

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        # Not --frozen-lockfile; the action will rewrite package.json versions,
        # and we want the lockfile in sync with those bumps.
        run: pnpm install

      - name: Build all TS packages
        # Builds sdk, game-snake, exercise-math. cli and cli-* are no-ops.
        run: pnpm -r run build

      - uses: actions/setup-go@v5
        id: go
        with:
          go-version: '1.23'

      - name: Cross-compile platform binaries (cli-pack)
        # CRITICAL: the 4 cli-* packages ship their binary inside bin/, and
        # those binaries are gitignored. Without this step, those packages
        # publish empty tarballs. See Makefile line 56-66.
        run: make cli-pack VERSION=$(node -p "require('./packages/plugin-claude/package.json').version")
        env:
          PATH: ${{ steps.go.outputs.go-install-path }}/bin:${{ env.PATH }}

      # Step 1: let changesets/action@v1 do the version-bump (writes
      # CHANGELOG, commits `chore(release): version packages` back to
      # main). It does NOT publish — we publish explicitly below so
      # we can serialize the pnpm invocations and avoid OOMing the
      # runner on 9 parallel `pnpm publish` children.
      #
      # NPM_TOKEN is passed via the action's `secrets.npm-token` input
      # (NOT via `env:` — the action doesn't read NPM_TOKEN from the
      # step's env block; the `secrets` input is the documented way).
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: echo "skipping action publish; custom step below"   # no-op
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          setupGitUser: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          npm-token: ${{ secrets.NPM_TOKEN }}
        env:
          NODE_OPTIONS: --max-old-space-size=2048

      # Step 2: publish sequentially, one package at a time, with an
      # .npmrc that pulls NPM_TOKEN from the action secret. This is
      # the load-bearing change vs. the previous workflow: pnpm
      # changeset publish spawns parallel `pnpm publish` children,
      # which OOMed the ubuntu-latest runner (7 GB default) at 9
      # parallel processes. Serializing via a workspace loop keeps
      # memory bounded.
      - name: Configure npm auth
        run: |
          cat > ~/.npmrc <<'EOF'
          registry=https://registry.npmjs.org/
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          //registry.npmjs.org/:always-auth=true
          EOF
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish changed packages sequentially
        # Walk workspace packages in dependency order. For each one, check
        # whether its version differs from npm; only publish if it does.
        # This makes a no-op run cheap (everything already up to date)
        # and a real run tight (one publish at a time).
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            name=$(node -p "require('$dir/package.json').name" 2>/dev/null) || continue
            # skip private packages (tsconfig, etc.)
            if node -e "process.exit(require('$dir/package.json').private ? 0 : 1)"; then
              echo "  $name: private, skip"
              continue
            fi
            local_v=$(node -p "require('$dir/package.json').version")
            published_v=$(npm view "$name" version 2>/dev/null || echo "")
            if [ "$local_v" = "$published_v" ]; then
              echo "  $name $local_v: already on npm, skip"
              continue
            fi
            echo "  $name $local_v: publishing..."
            (cd "$dir" && pnpm publish --access public --no-git-checks --provenance)
            echo "  $name $local_v: published"
          done
        env:
          NODE_OPTIONS: --max-old-space-size=2048