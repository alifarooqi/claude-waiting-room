name: release-npm

# Publishes the @waiting-room/* packages to npm when a Changesets markdown
# file (.changeset/*.md) is consumed. Peer to release.yml (goreleaser
# binary tarballs); they have non-intersecting triggers (branches vs tags).
#
# Why this workflow is custom rather than the default
# `changesets/action@v1`: the action spawns parallel `pnpm publish`
# children for every workspace package, which OOMs the 7 GB ubuntu
# runner when there are 9+ packages. We do the version-bump + publish
# ourselves in two explicit, serial, memory-bounded steps.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write            # push the version-bump commit
  pull-requests: write       # reserved for a future marketplace bump step
  id-token: write            # reserved for npm trusted publishing

# Two pushes to main within a short window: serialize, don't cancel.
# The action is idempotent — a no-op (no changesets) just exits cleanly.
concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history for the version-bump commit

      - uses: pnpm/action-setup@v4   # picks up packageManager field

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - uses: actions/setup-go@v5
        id: go
        with:
          go-version: '1.23'

      - name: Install dependencies
        # Not --frozen-lockfile; we rewrite package.json versions.
        run: pnpm install
        env:
          NODE_OPTIONS: --max-old-space-size=2048

      - name: Build all TS packages
        # Builds sdk, game-snake, exercise-math. cli and cli-* are no-ops.
        run: pnpm -r run build

      - name: Cross-compile platform binaries (cli-pack)
        # CRITICAL: the 4 cli-* packages ship their binary inside bin/, and
        # those binaries are gitignored. Without this step, those packages
        # publish empty tarballs. See Makefile line 56-66.
        run: make cli-pack VERSION=$(node -p "require('./packages/plugin-claude/package.json').version")
        env:
          PATH: ${{ steps.go.outputs.go-install-path }}/bin:${{ env.PATH }}

      # ==== Version-bump + commit ====
      # Bump versions per `.changeset/*.md`, write CHANGELOG, and commit
      # `chore(release): version packages` back to main. We do this
      # ourselves (not via changesets/action@v1) so we control the
      # execution: the action's default pnpm invocation fans out across
      # the whole workspace and OOMs the runner.
      - name: Configure git for the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply changesets (bump versions, write CHANGELOGs)
        # Run from repo root. Use --ignore-scripts to avoid any package
        # post-install hooks. If no .changeset/*.md files exist, this
        # is a no-op (pnpm exits 0) and we skip the commit step below.
        run: pnpm changeset version
        env:
          NODE_OPTIONS: --max-old-space-size=2048

      - name: Commit version bumps
        # Skip if no changesets were consumed (pnpm doesn't modify any files
        # in that case, but the action's diffing would just create an
        # empty commit otherwise). Use `git diff --quiet` to detect.
        run: |
          if git diff --quiet; then
            echo "No version bumps to commit; skipping."
            exit 0
          fi
          git add -A
          git commit -m "chore(release): version packages"
          git push origin HEAD:main
        env:
          NODE_OPTIONS: --max-old-space-size=2048

      # ==== Publish ====
      # Write a user-level .npmrc that pulls the token from the secret
      # env, then publish one package at a time, skipping any whose
      # version already matches what's on npm.
      - name: Configure npm auth
        run: |
          cat > ~/.npmrc <<'EOF'
          registry=https://registry.npmjs.org/
          //registry.npmjs.org/:_authToken=${NPM_TOKEN}
          //registry.npmjs.org/:always-auth=true
          EOF
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish changed packages sequentially
        # Walk workspace packages in dependency order. For each one, check
        # whether its version differs from npm; only publish if it does.
        # This makes a no-op run cheap (everything already up to date)
        # and a real run tight (one publish at a time, no OOM).
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            # Strip trailing slash so the require path doesn't get
            # interpreted as a UNC `//package.json` on macOS/Windows.
            dir=${dir%/}
            name=$(node -p "require('./$dir/package.json').name" 2>/dev/null) || continue
            # skip private packages (tsconfig, etc.)
            if node -e "process.exit(require('./$dir/package.json').private ? 0 : 1)"; then
              echo "  $name: private, skip"
              continue
            fi
            local_v=$(node -p "require('./$dir/package.json').version")
            published_v=$(npm view "$name" version 2>/dev/null || echo "")
            if [ "$local_v" = "$published_v" ]; then
              echo "  $name $local_v: already on npm, skip"
              continue
            fi
            echo "  $name $local_v: publishing..."
            (cd "$dir" && pnpm publish --access public --no-git-checks --provenance)
            echo "  $name $local_v: published"
          done
        env:
          NODE_OPTIONS: --max-old-space-size=2048
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}